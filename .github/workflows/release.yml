name: Publicar versão

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tumacord-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: |
          # O endpoint de auditoria do npm cai de vez em quando (503) e uma
          # indisponibilidade do registro não pode reprovar uma versão.
          for attempt in 1 2 3; do
            if output="$(npm audit --omit=dev --audit-level=high 2>&1)"; then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if ! grep -qiE 'audit endpoint returned an error|service unavailable|ECONNRESET|ETIMEDOUT|EAI_AGAIN' <<<"$output"; then
              exit 1
            fi
            echo "::warning::Registro npm indisponível na tentativa $attempt; tentando de novo."
            sleep $((attempt * 20))
          done
          echo "::warning::Auditoria ignorada: o registro npm segue indisponível."

      - name: Validar projeto
        run: |
          # A política de versão tem uma implementação só, e as adaptações dela
          # são geradas. Se alguém editar a saída em vez da fonte, ou publicar
          # sem regerar, a divergência aparece aqui — e não na máquina de quem
          # instalou.
          node scripts/generate-version.mjs --check
          npm run typecheck
          # O log completo de uma execução exige login no GitHub, e uma versão
          # reprovada sem motivo visível custa uma ida ao navegador toda vez.
          # As anotações, ao contrário, são públicas: o nome do teste que
          # reprovou passa a aparecer ali, ao lado do "exit code 1".
          set -o pipefail
          if ! npm test 2>&1 | tee "$RUNNER_TEMP/testes.log"; then
            # Cada `not ok` mais as linhas seguintes: o nome do teste sozinho
            # diz onde olhar, e o bloco de erro do TAP diz o quê.
            awk '/^not ok /{ janela = 14 } janela && janela-- { print }' "$RUNNER_TEMP/testes.log" | head -60 | while IFS= read -r linha; do
              echo "::error::${linha}"
            done
            exit 1
          fi

      - name: Validar servidor de encontro e relay
        env:
          TUMACORD_SERVER_ACCESS_KEY: chave-apenas-para-validacao-ci
          # O serviço do coturn exige estas variáveis para não subir mal
          # configurado. `docker compose config` avalia essa exigência, então
          # a validação precisa fornecê-las — inclusive as do perfil `turn`,
          # que o `config` inspeciona mesmo sem iniciar o contêiner.
          TUMACORD_TURN_REALM: turn.validacao-ci
          TUMACORD_TURN_SECRET: segredo-apenas-para-validacao-ci
          TUMACORD_TURN_PUBLIC_IP: 203.0.113.10
        run: |
          docker compose config --quiet
          docker compose --profile turn config --quiet
          docker build --tag tumacord-server:ci .

      - name: Gerar pacote portátil opcional
        run: npm run package:linux

      # A build do Windows saía daqui por cruzamento até a 0.8.7, quando não
      # havia nada nativo para compilar. A partir da 0.8.8 há: a captura de
      # áudio por aplicação é WASAPI, e cruzar isso do Linux seria frágil de um
      # jeito que só apareceria na máquina de quem baixou. Ela vive em
      # `.github/workflows/windows.yml`, num runner Windows de verdade.

      - name: Guardar AppImage de toda build
        uses: actions/upload-artifact@v7
        with:
          name: tumacord-linux-${{ github.run_number }}
          if-no-files-found: error
          path: |
            release/Tumacord-*.AppImage
            release/tumacord-*.tar.gz

      - name: Publicar arquivos da versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # A etiqueta precisa caber na convenção de versão do produto antes de
          # virar uma Release. `v0.9.9` e `v0.9.9-1` passam; `v0.9.9-rc1`,
          # `v01.0.0` e `v1.0` não — publicar sob uma etiqueta que o aplicativo
          # não sabe ordenar produz uma versão que ninguém recebe.
          if ! node -e '
            const { TAG_PATTERN } = require("./desktop/version.generated.cjs");
            if (!TAG_PATTERN.test(process.argv[1])) {
              console.error(`Etiqueta fora da convenção do produto: ${process.argv[1]}`);
              process.exit(1);
            }
          ' "$tag"; then
            exit 1
          fi
          # As notas da Release saem do CHANGELOG: é lá que a versão está
          # explicada, e uma lista de commits gerada automaticamente não conta
          # a mesma história para quem só quer saber o que mudou.
          notes_file="$(mktemp)"
          awk -v version="${tag#v}" '
            index($0, "## " version " ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"
          # O título também sai do CHANGELOG. "Tumacord v0.7.9" seria correto e
          # ainda assim destoaria: toda Release anterior se chama
          # "Tumacord 0.7.8 — manchete", e essas foram renomeadas à mão depois.
          headline="$(awk -v version="${tag#v}" 'index($0, "## " version " ") == 1 { sub(/^## /, ""); print; exit }' CHANGELOG.md)"
          title="Tumacord ${headline:-$tag}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # O canal é um campo explícito, e não um palpite sobre o
            # formato da etiqueta.
            #
            # Até a 0.9.9 este passo marcava como prerelease **toda** etiqueta
            # com hífen. Na convenção do produto o hífen é a revisão de
            # manutenção — `v0.9.9-1` é a correção da 0.9.9, a versão mais
            # estável que existe no momento em que sai —, e marcá-la como
            # ensaio faria o cliente que só aceita canal estável recusar
            # justamente a correção que ele precisa.
            extra=()
            if [[ "${TUMACORD_CANAL:-stable}" == "test" ]]; then
              extra+=(--prerelease)
            fi
            if [[ -s "$notes_file" ]]; then
              gh release create "$tag" --title "$title" --notes-file "$notes_file" "${extra[@]}"
            else
              echo "::warning::CHANGELOG sem seção para $tag; usando notas geradas."
              gh release create "$tag" --title "$title" --generate-notes "${extra[@]}"
            fi
          elif [[ -s "$notes_file" ]]; then
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          fi
          # Os arquivos do Windows são anexados pelo job `windows`, que roda em
          # uma máquina Windows e assina o que gera.
          gh release upload "$tag" --clobber \
            release/Tumacord-*.AppImage \
            release/tumacord-*.tar.gz
