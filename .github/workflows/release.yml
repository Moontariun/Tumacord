name: Publicar versão Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar projeto
        run: |
          npm run typecheck
          npm test

      - name: Gerar AppImage
        run: npm run package:linux

      - name: Publicar arquivos da versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            extra=()
            [[ "$tag" == *-* ]] && extra+=(--prerelease)
            gh release create "$tag" --title "Tumacord $tag" --generate-notes "${extra[@]}"
          fi
          gh release upload "$tag" --clobber \
            release/Tumacord-*.AppImage \
            release/tumacord-*.tar.gz

      - name: Guardar artefatos do teste manual
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: tumacord-linux
          path: |
            release/Tumacord-*.AppImage
            release/tumacord-*.tar.gz
