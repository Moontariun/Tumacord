name: Publicar versão Linux

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tumacord-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: |
          # O endpoint de auditoria do npm cai de vez em quando (503) e uma
          # indisponibilidade do registro não pode reprovar uma versão.
          for attempt in 1 2 3; do
            if output="$(npm audit --omit=dev --audit-level=high 2>&1)"; then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if ! grep -qiE 'audit endpoint returned an error|service unavailable|ECONNRESET|ETIMEDOUT|EAI_AGAIN' <<<"$output"; then
              exit 1
            fi
            echo "::warning::Registro npm indisponível na tentativa $attempt; tentando de novo."
            sleep $((attempt * 20))
          done
          echo "::warning::Auditoria ignorada: o registro npm segue indisponível."

      - name: Validar projeto
        run: |
          npm run typecheck
          npm test

      - name: Validar servidor dedicado Docker
        env:
          TUMACORD_SERVER_ACCESS_KEY: chave-apenas-para-validacao-ci
        run: |
          docker compose config --quiet
          docker build --tag tumacord-server:ci .

      - name: Gerar pacote portátil opcional
        run: npm run package:linux

      - name: Guardar AppImage de toda build
        uses: actions/upload-artifact@v7
        with:
          name: tumacord-linux-${{ github.run_number }}
          if-no-files-found: error
          path: |
            release/Tumacord-*.AppImage
            release/tumacord-*.tar.gz

      - name: Publicar arquivos da versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # As notas da Release saem do CHANGELOG: é lá que a versão está
          # explicada, e uma lista de commits gerada automaticamente não conta
          # a mesma história para quem só quer saber o que mudou.
          notes_file="$(mktemp)"
          awk -v version="${tag#v}" '
            index($0, "## " version " ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            extra=()
            [[ "$tag" == *-* ]] && extra+=(--prerelease)
            if [[ -s "$notes_file" ]]; then
              gh release create "$tag" --title "Tumacord $tag" --notes-file "$notes_file" "${extra[@]}"
            else
              echo "::warning::CHANGELOG sem seção para $tag; usando notas geradas."
              gh release create "$tag" --title "Tumacord $tag" --generate-notes "${extra[@]}"
            fi
          elif [[ -s "$notes_file" ]]; then
            gh release edit "$tag" --title "Tumacord $tag" --notes-file "$notes_file"
          fi
          gh release upload "$tag" --clobber \
            release/Tumacord-*.AppImage \
            release/tumacord-*.tar.gz
