name: Publicar versão Linux

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tumacord-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Validar projeto
        run: |
          npm run typecheck
          npm test

      - name: Validar servidor dedicado Docker
        env:
          TUMACORD_SERVER_ACCESS_KEY: chave-apenas-para-validacao-ci
        run: |
          docker compose config --quiet
          docker build --tag tumacord-server:ci .

      - name: Gerar pacote portátil opcional
        run: npm run package:linux

      - name: Guardar AppImage de toda build
        uses: actions/upload-artifact@v7
        with:
          name: tumacord-linux-${{ github.run_number }}
          if-no-files-found: error
          path: |
            release/Tumacord-*.AppImage
            release/tumacord-*.tar.gz

      - name: Publicar arquivos da versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            extra=()
            [[ "$tag" == *-* ]] && extra+=(--prerelease)
            gh release create "$tag" --title "Tumacord $tag" --generate-notes "${extra[@]}"
          fi
          gh release upload "$tag" --clobber \
            release/Tumacord-*.AppImage \
            release/tumacord-*.tar.gz
