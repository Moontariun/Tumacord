<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tumacord</title>
  <desc id="desc">Tomate sorridente com headset grafite</desc>
  <defs>
    <linearGradient id="tomato" x1="154" y1="174" x2="355" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff645b"/>
      <stop offset="0.48" stop-color="#ed343d"/>
      <stop offset="1" stop-color="#b81731"/>
    </linearGradient>
    <linearGradient id="tomatoEdge" x1="256" y1="160" x2="256" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b41d31"/>
      <stop offset="1" stop-color="#741429"/>
    </linearGradient>
    <linearGradient id="leaf" x1="202" y1="88" x2="305" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7fd64a"/>
      <stop offset="0.55" stop-color="#3ca34d"/>
      <stop offset="1" stop-color="#17633c"/>
    </linearGradient>
    <linearGradient id="headband" x1="119" y1="82" x2="402" y2="265" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b3f4c"/>
      <stop offset="0.52" stop-color="#232630"/>
      <stop offset="1" stop-color="#12141b"/>
    </linearGradient>
    <linearGradient id="earcup" x1="74" y1="247" x2="130" y2="393" gradientUnits="userSpaceOnUse">
      <stop stop-color="#363a46"/>
      <stop offset="0.55" stop-color="#20232d"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="earcupRight" x1="438" y1="247" x2="382" y2="393" gradientUnits="userSpaceOnUse">
      <stop stop-color="#363a46"/>
      <stop offset="0.55" stop-color="#20232d"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="mouth" x1="256" y1="332" x2="256" y2="406" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44101f"/>
      <stop offset="1" stop-color="#1b0c17"/>
    </linearGradient>
  </defs>

  <!-- Headset: every surface is intentionally dark graphite. -->
  <path d="M88 267v-49C88 112 158 44 256 44s168 68 168 174v49" fill="none" stroke="#090b10" stroke-width="55" stroke-linecap="round"/>
  <path d="M88 267v-49C88 112 158 44 256 44s168 68 168 174v49" fill="none" stroke="url(#headband)" stroke-width="37" stroke-linecap="round"/>
  <path d="M111 188c14-70 69-113 145-113s131 43 145 113" fill="none" stroke="#505462" stroke-width="5" stroke-linecap="round" opacity=".42"/>
  <path d="M92 233v45M420 233v45" stroke="#9e2639" stroke-width="9" stroke-linecap="round"/>

  <!-- Tomato body. -->
  <path d="M256 143c-111 0-188 70-188 177 0 101 77 167 188 167s188-66 188-167c0-107-77-177-188-177z" fill="url(#tomatoEdge)"/>
  <path d="M256 151c-104 0-178 65-178 169 0 94 72 157 178 157s178-63 178-157c0-104-74-169-178-169z" fill="url(#tomato)"/>
  <path d="M121 277c15-55 57-91 114-104-51 28-77 69-83 125-7 71 24 128 75 164-91-13-149-66-149-142 0-15 1-29 5-43z" fill="#ff7667" opacity=".19"/>
  <path d="M182 199c19-12 40-19 63-21" fill="none" stroke="#ff9a87" stroke-width="12" stroke-linecap="round" opacity=".34"/>

  <!-- Compact crown keeps the silhouette readable at launcher size. -->
  <g stroke="#145437" stroke-width="7" stroke-linejoin="round">
    <path d="M256 174c-26-30-23-84 0-111 23 27 26 81 0 111z" fill="url(#leaf)"/>
    <path d="M252 177c-54-2-93-25-109-62 43-9 84 10 115 48z" fill="url(#leaf)"/>
    <path d="M260 177c54-2 93-25 109-62-43-9-84 10-115 48z" fill="url(#leaf)"/>
    <path d="M252 180c-43 25-87 31-119 6 27-31 69-40 123-17z" fill="url(#leaf)"/>
    <path d="M260 180c43 25 87 31 119 6-27-31-69-40-123-17z" fill="url(#leaf)"/>
  </g>
  <path d="M256 88v82" stroke="#9de35b" stroke-width="5" stroke-linecap="round" opacity=".62"/>

  <!-- Balanced forward-looking face. -->
  <path d="M172 264c14-12 32-13 47-2M293 262c15-11 33-10 47 2" fill="none" stroke="#681b2c" stroke-width="11" stroke-linecap="round"/>
  <rect x="181" y="278" width="54" height="66" rx="27" fill="#17151d"/>
  <rect x="277" y="278" width="54" height="66" rx="27" fill="#17151d"/>
  <ellipse cx="208" cy="308" rx="12" ry="15" fill="#f8e9cf"/>
  <ellipse cx="304" cy="308" rx="12" ry="15" fill="#f8e9cf"/>
  <circle cx="208" cy="310" r="5" fill="#d7baa0" opacity=".54"/>
  <circle cx="304" cy="310" r="5" fill="#d7baa0" opacity=".54"/>
  <path d="M198 360c18 31 98 31 116 0 4 53-23 78-58 78s-62-25-58-78z" fill="url(#mouth)" stroke="#7f152b" stroke-width="7" stroke-linejoin="round"/>
  <path d="M218 371c18 11 58 11 76 0-5 17-19 26-38 26s-33-9-38-26z" fill="#f8e9cf"/>
  <path d="M229 420c15-16 39-16 54 0-8 8-18 12-27 12s-19-4-27-12z" fill="#e8485b"/>

  <!-- Ear cups: graphite, black and muted red only. -->
  <rect x="42" y="235" width="96" height="184" rx="47" fill="#090b10"/>
  <rect x="52" y="244" width="76" height="166" rx="37" fill="url(#earcup)" stroke="#424653" stroke-width="4"/>
  <path d="M78 278v96" stroke="#a2293d" stroke-width="9" stroke-linecap="round"/>
  <path d="M91 274v104" stroke="#6d344f" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <rect x="374" y="235" width="96" height="184" rx="47" fill="#090b10"/>
  <rect x="384" y="244" width="76" height="166" rx="37" fill="url(#earcupRight)" stroke="#424653" stroke-width="4"/>
  <path d="M434 278v96" stroke="#a2293d" stroke-width="9" stroke-linecap="round"/>
  <path d="M421 274v104" stroke="#6d344f" stroke-width="4" stroke-linecap="round" opacity=".85"/>

  <!-- Boom microphone. -->
  <path d="M427 350c-3 48-42 76-102 76" fill="none" stroke="#090b10" stroke-width="21" stroke-linecap="round"/>
  <path d="M427 350c-3 45-40 66-102 66" fill="none" stroke="#30343f" stroke-width="11" stroke-linecap="round"/>
  <rect x="296" y="394" width="83" height="48" rx="24" fill="#090b10" transform="rotate(-5 337.5 418)"/>
  <rect x="304" y="401" width="68" height="34" rx="17" fill="#2b2f39" stroke="#444955" stroke-width="3" transform="rotate(-5 338 418)"/>
  <path d="M320 410h22" stroke="#9e2639" stroke-width="5" stroke-linecap="round" opacity=".8"/>
</svg>
