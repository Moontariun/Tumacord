<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tumacord</title>
  <desc id="desc">Tomate vermelho sorrindo com headset azul e microfone</desc>
  <defs>
    <linearGradient id="headset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5142a4"/>
      <stop offset="0.5" stop-color="#29275e"/>
      <stop offset="1" stop-color="#151936"/>
    </linearGradient>
    <linearGradient id="earcup" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#373579"/>
      <stop offset="1" stop-color="#171a3c"/>
    </linearGradient>
    <linearGradient id="tomato" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff675b"/>
      <stop offset="0.48" stop-color="#f13d42"/>
      <stop offset="1" stop-color="#b91f39"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8f34b"/>
      <stop offset="0.48" stop-color="#5fc73c"/>
      <stop offset="1" stop-color="#20834c"/>
    </linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#300d27"/>
      <stop offset="1" stop-color="#120c20"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#070717" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Headset behind the mascot. The canvas stays completely transparent. -->
  <path d="M86 263V210C86 111 163 42 256 42s170 69 170 168v53" fill="none" stroke="#0b1028" stroke-width="48" stroke-linecap="round"/>
  <path d="M86 263V210C86 111 163 42 256 42s170 69 170 168v53" fill="none" stroke="url(#headset)" stroke-width="32" stroke-linecap="round"/>
  <path d="M84 229c-23 3-39 22-39 46v91c0 27 19 49 45 52l24 3 13-169z" fill="#101630" opacity="0.4"/>
  <path d="M428 229c23 3 39 22 39 46v91c0 27-19 49-45 52l-24 3-13-169z" fill="#101630" opacity="0.4"/>
  <g>
    <rect x="38" y="225" width="96" height="182" rx="45" fill="url(#earcup)" stroke="#111532" stroke-width="8"/>
    <rect x="378" y="225" width="96" height="182" rx="45" fill="url(#earcup)" stroke="#111532" stroke-width="8"/>
    <path d="M66 276v91" stroke="#8eeeff" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
    <path d="M446 276v91" stroke="#8eeeff" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
    <path d="M72 273v95" stroke="#b24bff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M440 273v95" stroke="#b24bff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Tomato body -->
  <path d="M256 150c-104 0-184 63-184 171 0 87 72 150 184 150s184-63 184-150c0-108-80-171-184-171z" fill="#6b1532" opacity="0.3" filter="url(#soft)"/>
  <path d="M256 138c-110 0-188 67-188 176 0 100 75 171 188 171s188-71 188-171c0-109-78-176-188-176z" fill="url(#tomato)" stroke="#8d1c36" stroke-width="8"/>
  <ellipse cx="191" cy="244" rx="58" ry="32" fill="#ff8f78" opacity="0.24" transform="rotate(-26 191 244)"/>
  <ellipse cx="323" cy="380" rx="80" ry="30" fill="#821b3a" opacity="0.22" transform="rotate(-8 323 380)"/>

  <!-- Leaves -->
  <path d="M256 170c-37-34-29-96 0-117 29 21 37 83 0 117z" fill="url(#leaf)" stroke="#247c3d" stroke-width="7" stroke-linejoin="round"/>
  <path d="M249 170c-64 3-115-25-125-69 49-10 98 12 132 51z" fill="url(#leaf)" stroke="#247c3d" stroke-width="7" stroke-linejoin="round"/>
  <path d="M263 170c64 3 115-25 125-69-49-10-98 12-132 51z" fill="url(#leaf)" stroke="#247c3d" stroke-width="7" stroke-linejoin="round"/>
  <path d="M255 176c-43 33-96 45-137 19 24-40 73-56 137-29z" fill="url(#leaf)" stroke="#247c3d" stroke-width="7" stroke-linejoin="round"/>
  <path d="M257 176c43 33 96 45 137 19-24-40-73-56-137-29z" fill="url(#leaf)" stroke="#247c3d" stroke-width="7" stroke-linejoin="round"/>
  <path d="M256 99v75M145 111c39 22 72 42 107 64M367 111c-39 22-72 42-107 64" fill="none" stroke="#d7ff63" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- Friendly face -->
  <path d="M158 258c12-14 30-16 43-4M311 254c13-12 31-10 43 4" fill="none" stroke="#48162d" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="181" cy="293" rx="25" ry="34" fill="#17162c" stroke="#3f284d" stroke-width="5"/>
  <ellipse cx="331" cy="293" rx="25" ry="34" fill="#17162c" stroke="#3f284d" stroke-width="5"/>
  <ellipse cx="173" cy="283" rx="8" ry="11" fill="#fff"/>
  <ellipse cx="323" cy="283" rx="8" ry="11" fill="#fff"/>
  <path d="M210 330c17 20 75 20 92 0 7 38-13 60-46 60s-53-22-46-60z" fill="url(#mouth)" stroke="#4d102d" stroke-width="6"/>
  <path d="M235 367c12-12 30-12 42 0-6 12-36 12-42 0z" fill="#ff5961"/>

  <!-- Boom microphone -->
  <path d="M422 342c-7 48-47 72-103 72" fill="none" stroke="#111630" stroke-width="13" stroke-linecap="round"/>
  <rect x="300" y="391" width="76" height="44" rx="22" fill="url(#headset)" stroke="#111630" stroke-width="6" transform="rotate(-5 338 413)"/>
  <circle cx="323" cy="412" r="9" fill="#7cffff" stroke="#2db9d5" stroke-width="4"/>
</svg>
